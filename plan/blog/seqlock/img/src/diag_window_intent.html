<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#0F141A;--surface:#161D25;--sunk:#1C242D;--ink:#E3E9EF;--muted:#8C9BAA;--line:#2B353F;--writer:#E8A44E;--reader:#4FBCC7;--tear:#EC7A70;--w-tint:rgba(232,164,78,.16);--r-tint:rgba(79,188,199,.16);--t-tint:rgba(236,122,112,.14);}
html,body{margin:0;background:#0b0f14}
.fig{display:inline-block;padding:40px 48px;background:radial-gradient(130% 130% at 15% 0%,#141c26 0%,#0b0f14 72%)}
svg{display:block;width:900px;height:auto}
.s-ink{stroke:var(--ink)}.f-ink{fill:var(--ink)}.s-line{stroke:var(--line)}.f-muted{fill:var(--muted)}.s-muted{stroke:var(--muted)}
.s-w{stroke:var(--writer)}.f-w{fill:var(--writer)}.f-wt{fill:var(--w-tint)}.s-r{stroke:var(--reader)}.f-r{fill:var(--reader)}.f-rt{fill:var(--r-tint)}
.s-t{stroke:var(--tear)}.f-t{fill:var(--tear)}.f-tt{fill:var(--t-tint)}.f-surf{fill:var(--surface)}.f-sunk{fill:var(--sunk)}.none{fill:none}
.lbl{font-family:"JetBrains Mono",monospace;font-size:12px}.lbl-sm{font-family:"JetBrains Mono",monospace;font-size:10.5px}
.lbl-lg{font-family:Archivo,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em}
</style></head><body><div class="fig"><svg viewBox="0 0 880 296" role="img" aria-label="Hai lane thời gian: writer kẹp phép ghi payload giữa hai lần chạm seq, reader kẹp phép copy payload giữa hai lần đọc seq.">
        <defs>
          <marker id="ah-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <polygon points="0,0 8,4 0,8" class="f-ink"/>
          </marker>
          <marker id="ah-muted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <polygon points="0,0 8,4 0,8" class="f-muted"/>
          </marker>
        </defs>

        <!-- writer window -->
        <rect x="196" y="34" width="372" height="86" rx="4" class="f-wt"/>
        <text x="382" y="27" text-anchor="middle" class="lbl-sm f-w">cửa sổ ghi — seq lẻ</text>

        <text x="12" y="82" class="lbl-lg f-w">WRITER</text>

        <line x1="196" y1="34" x2="196" y2="120" class="s-w" stroke-width="2.5"/>
        <line x1="568" y1="34" x2="568" y2="120" class="s-w" stroke-width="2.5"/>
        <text x="196" y="140" text-anchor="middle" class="lbl f-w">seq 8 → 9</text>
        <text x="568" y="140" text-anchor="middle" class="lbl f-w">seq 9 → 10</text>
        <text x="196" y="155" text-anchor="middle" class="lbl-sm f-muted">(chẵn → lẻ)</text>
        <text x="568" y="155" text-anchor="middle" class="lbl-sm f-muted">(lẻ → chẵn)</text>

        <rect x="252" y="57" width="260" height="40" rx="4" class="f-surf s-w" stroke-width="1.5"/>
        <text x="382" y="82" text-anchor="middle" class="lbl f-ink">ghi payload</text>

        <!-- reader window -->
        <rect x="256" y="186" width="392" height="72" rx="4" class="f-rt"/>
        <text x="452" y="179" text-anchor="middle" class="lbl-sm f-r">cửa sổ kiểm tra</text>

        <text x="12" y="228" class="lbl-lg f-r">READER</text>

        <line x1="256" y1="186" x2="256" y2="258" class="s-r" stroke-width="2.5"/>
        <line x1="648" y1="186" x2="648" y2="258" class="s-r" stroke-width="2.5"/>
        <text x="256" y="277" text-anchor="middle" class="lbl f-r">s1 = seq</text>
        <text x="648" y="277" text-anchor="middle" class="lbl f-r">s2 = seq</text>

        <rect x="308" y="202" width="288" height="40" rx="4" class="f-surf s-r" stroke-width="1.5"/>
        <text x="452" y="227" text-anchor="middle" class="lbl f-ink">copy payload</text>

        <!-- time axis -->
        <line x1="86" y1="166" x2="820" y2="166" class="s-muted" stroke-width="1" stroke-dasharray="3 4" marker-end="url(#ah-muted)"/>
        <text x="828" y="170" class="lbl-sm f-muted">thời gian</text>
      </svg></div></body></html>
