<style>:root{--surface:#161D25;--sunk:#1C242D;--ink:#E3E9EF;--muted:#8C9BAA;--line:#2B353F;--reader:#4FBCC7;--tear:#EC7A70;--r-tint:rgba(79,188,199,.16);--t-tint:rgba(236,122,112,.16)}
