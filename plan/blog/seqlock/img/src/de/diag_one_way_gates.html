<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#0F141A;--surface:#161D25;--sunk:#1C242D;--ink:#E3E9EF;--muted:#8C9BAA;--line:#2B353F;--writer:#E8A44E;--reader:#4FBCC7;--tear:#EC7A70;--w-tint:rgba(232,164,78,.16);--r-tint:rgba(79,188,199,.16);--t-tint:rgba(236,122,112,.14);}
html,body{margin:0;background:#0b0f14}
.fig{display:inline-block;padding:40px 48px;background:radial-gradient(130% 130% at 15% 0%,#141c26 0%,#0b0f14 72%)}
svg{display:block;width:940px;height:auto}
.s-ink{stroke:var(--ink)}.f-ink{fill:var(--ink)}.s-line{stroke:var(--line)}.f-muted{fill:var(--muted)}.s-muted{stroke:var(--muted)}
.s-w{stroke:var(--writer)}.f-w{fill:var(--writer)}.f-wt{fill:var(--w-tint)}.s-r{stroke:var(--reader)}.f-r{fill:var(--reader)}.f-rt{fill:var(--r-tint)}
.s-t{stroke:var(--tear)}.f-t{fill:var(--tear)}.f-tt{fill:var(--t-tint)}.f-surf{fill:var(--surface)}.f-sunk{fill:var(--sunk)}.none{fill:none}
.lbl{font-family:"JetBrains Mono",monospace;font-size:12px}.lbl-sm{font-family:"JetBrains Mono",monospace;font-size:10.5px}
.lbl-lg{font-family:Archivo,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em}
</style></head><body><div class="fig"><svg viewBox="0 0 880 240" role="img" aria-label="Hai panel. Release chặn các truy cập đứng trước trôi xuống sau, nhưng để lọt các truy cập đứng sau trôi lên trước. Acquire thì ngược lại.">
        <defs>
          <marker id="ah-tear2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <polygon points="0,0 8,4 0,8" class="f-t"/>
          </marker>
          <marker id="ah-ink2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <polygon points="0,0 8,4 0,8" class="f-ink"/>
          </marker>
        </defs>

        <!-- PANEL A : Release -->
        <text x="16" y="22" class="lbl-lg f-ink">store(Release)</text>

        <rect x="16" y="42" width="112" height="48" rx="4" class="f-sunk s-line" stroke-width="1.2"/>
        <text x="72" y="66" text-anchor="middle" class="lbl f-ink">A</text>
        <text x="72" y="81" text-anchor="middle" class="lbl-sm f-muted">davor</text>

        <rect x="290" y="42" width="112" height="48" rx="4" class="f-sunk s-line" stroke-width="1.2"/>
        <text x="346" y="66" text-anchor="middle" class="lbl f-ink">B</text>
        <text x="346" y="81" text-anchor="middle" class="lbl-sm f-muted">danach</text>

        <line x1="209" y1="24" x2="209" y2="196" class="s-ink" stroke-width="3"/>
        <text x="209" y="212" text-anchor="middle" class="lbl-sm f-muted">Tor</text>

        <!-- A trying to move later: blocked -->
        <line x1="134" y1="112" x2="196" y2="112" class="none s-ink" stroke-width="2" marker-end="url(#ah-ink2)"/>
        <text x="120" y="116" text-anchor="end" class="lbl-sm f-ink">A nach hinten</text>
        <line x1="201" y1="102" x2="217" y2="122" class="s-ink" stroke-width="2.5"/>
        <line x1="217" y1="102" x2="201" y2="122" class="s-ink" stroke-width="2.5"/>
        <text x="232" y="116" class="lbl-sm f-ink">blockiert</text>

        <!-- B moving earlier: allowed -->
        <line x1="284" y1="160" x2="222" y2="160" class="none s-t" stroke-width="2" marker-end="url(#ah-tear2)"/>
        <text x="298" y="164" class="lbl-sm f-t">B nach vorn</text>
        <text x="196" y="164" text-anchor="end" class="lbl-sm f-t">kommt durch</text>

        <!-- PANEL B : Acquire -->
        <line x1="452" y1="10" x2="452" y2="222" class="s-line" stroke-width="1"/>

        <text x="486" y="22" class="lbl-lg f-ink">load(Acquire)</text>

        <rect x="486" y="42" width="112" height="48" rx="4" class="f-sunk s-line" stroke-width="1.2"/>
        <text x="542" y="66" text-anchor="middle" class="lbl f-ink">A</text>
        <text x="542" y="81" text-anchor="middle" class="lbl-sm f-muted">davor</text>

        <rect x="760" y="42" width="112" height="48" rx="4" class="f-sunk s-line" stroke-width="1.2"/>
        <text x="816" y="66" text-anchor="middle" class="lbl f-ink">B</text>
        <text x="816" y="81" text-anchor="middle" class="lbl-sm f-muted">danach</text>

        <line x1="679" y1="24" x2="679" y2="196" class="s-ink" stroke-width="3"/>
        <text x="679" y="212" text-anchor="middle" class="lbl-sm f-muted">Tor</text>

        <!-- A moving later: allowed -->
        <line x1="604" y1="112" x2="666" y2="112" class="none s-t" stroke-width="2" marker-end="url(#ah-tear2)"/>
        <text x="590" y="116" text-anchor="end" class="lbl-sm f-t">A nach hinten</text>
        <text x="692" y="116" class="lbl-sm f-t">kommt durch</text>

        <!-- B moving earlier: blocked -->
        <line x1="754" y1="160" x2="692" y2="160" class="none s-ink" stroke-width="2" marker-end="url(#ah-ink2)"/>
        <text x="768" y="164" class="lbl-sm f-ink">B nach vorn</text>
        <line x1="671" y1="150" x2="687" y2="170" class="s-ink" stroke-width="2.5"/>
        <line x1="687" y1="150" x2="671" y2="170" class="s-ink" stroke-width="2.5"/>
        <text x="660" y="164" text-anchor="end" class="lbl-sm f-ink">blockiert</text>
      </svg></div></body></html>
