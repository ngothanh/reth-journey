[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["crates/.claude"]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["Edward Ngo <thanh.ngo.2510@gmail.com>"]
repository = "https://github.com/edward-ngo/reth-journey"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
eth-primitives = { path = "crates/eth-primitives" }
concurrent = { path = "crates/concurrent" }
eth-chain-state = { path = "crates/eth-chain-state" }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
trybuild = "1.0"