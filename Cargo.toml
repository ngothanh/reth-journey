[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["crates/.claude"]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["Edward Ngo <thanh.ngo.2510@gmail.com>"]
repository = "https://github.com/edward-ngo/reth-journey"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# Layer 0 — done, frozen.
eth-primitives = { path = "crates/eth-primitives" }
eth-rlp = { path = "crates/eth-rlp" }
# Layer 1 — substrate consumed by every product (see plan/PRODUCT_TREE.md §4).
concurrent = { path = "crates/concurrent" }
backpressure = { path = "crates/backpressure" }
bufpool = { path = "crates/bufpool" }

criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
trybuild = "1.0"

# Differential-test oracles only — never linked into a hot path (PRODUCT_TREE.md §5).
alloy-rlp = { version = "0.3", features = ["derive"] }
alloy-primitives = { version = "1.6.1" }