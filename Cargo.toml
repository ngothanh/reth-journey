[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["Edward Ngo <thanh.ngo.2510@gmail.com>"]
repository = "https://github.com/edward-ngo/reth-journey"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
eth-primitives = { path = "crates/eth-primitives" }