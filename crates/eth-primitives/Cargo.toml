[package]
name = "eth-primitives"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Mirrors alloy-primitives — Address, B256, U256, Bytes, FixedBytes."

[lints]
workspace = true

[features]
default = []
# Implements `eth_rlp::{Encodable, Decodable}` for the primitive types. Optional so
# `eth-primitives` stays usable without pulling in the codec, mirroring `alloy-primitives`.
rlp = ["dep:eth-rlp"]

[dependencies]
eth-rlp = { workspace = true, optional = true }
tiny-keccak = { version = "2.0", features = ["keccak"] }
hex = "0.4.3"
thiserror = "2.0.18"
ruint = "1.12"
eth-primitives-derive.workspace = true

[dev-dependencies]
trybuild.workspace = true

[[bench]]
name = "freeze"
harness = false