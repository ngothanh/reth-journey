[package]
name = "eth-chain-state"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
eth-primitives.workspace = true
concurrent.workspace = true

[lints]
workspace = true

# loom is used in library code (the `cfg(loom)` yield helper in chain_head.rs),
# not just tests, so it must be a regular dependency — dev-dependencies are not
# linked into the lib target. Mirrors `concurrent`'s setup.
[target.'cfg(loom)'.dependencies]
loom = "0.7.2"